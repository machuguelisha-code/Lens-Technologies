<svg width="80" height="50" xmlns="http://www.w3.org/2000/svg">
  <!-- First speech bubble -->
  <ellipse cx="25" cy="20" rx="20" ry="12" fill="#dcf8c6" stroke="#075e54" stroke-width="2"/>
  <!-- Second speech bubble -->
  <ellipse cx="55" cy="30" rx="20" ry="12" fill="#ffffff" stroke="#075e54" stroke-width="2"/>
  <!-- Conversation dots in first bubble -->
  <circle cx="20" cy="18" r="2" fill="#075e54"/>
  <circle cx="25" cy="18" r="2" fill="#075e54"/>
  <circle cx="30" cy="18" r="2" fill="#075e54"/>
  <!-- Dots in second bubble -->
  <circle cx="50" cy="28" r="2" fill="#075e54"/>
  <circle cx="55" cy="28" r="2" fill="#075e54"/>
  <circle cx="60" cy="28" r="2" fill="#075e54"/>
</svg>